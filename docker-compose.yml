# 리햅톡 — 역할별 컨테이너
#
#   chroma    검색 인덱스 저장·조회
#   backend   규칙 판정 · AI 호출 · API · 환자 모바일 웹
#   frontend  치료사 화면 (표시·입력만, 백엔드 API만 호출)
#
#   실행:  docker compose up -d --build
#   치료사 http://localhost:8501   환자 http://localhost:8000/p/tok_kim62
#
#   포트가 이미 쓰이고 있으면 .env 에서 바꾼다:
#     BACKEND_PORT=18000
#     FRONTEND_PORT=18501

services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: rehabtalk-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: rehabtalk-backend
    depends_on:
      chroma:
        condition: service_healthy
    env_file:
      - .env                      # UPSTAGE_API_KEY / ANTHROPIC_API_KEY (없으면 목업으로 동작)
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      REHABTALK_DB: /var/lib/rehabtalk/rehabtalk.db
      # 환자가 자기 폰 브라우저로 여는 링크라 호스트 주소여야 한다
      PATIENT_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    volumes:
      - rehabtalk-data:/var/lib/rehabtalk
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: rehabtalk-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REHABTALK_API: http://backend:8000     # 컨테이너 네트워크 안에서 부른다
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    restart: unless-stopped

volumes:
  rehabtalk-data:      # SQLite — 환자·처방·피드백
  chroma-data:         # 검색 인덱스
